[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudpulse"
version = "2.0.0"
description = "Performance and reliability analyzer for Amazon EC2 <-> S3 file transfers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []  # the analytics core is dependency-free; pick extras for the components you run

[project.optional-dependencies]
agent = ["boto3>=1.34", "psutil>=5.9", "requests>=2.31"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6", "boto3>=1.34"]
dashboard = ["streamlit>=1.39", "plotly>=5.20", "pandas>=2.1", "requests>=2.31"]
dev = ["pytest>=8", "httpx>=0.27"]
all = ["cloudpulse[agent,api,dashboard]"]

[project.scripts]
cloudpulse = "cloudpulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
